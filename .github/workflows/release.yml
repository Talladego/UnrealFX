# Build the installable UnrealFX zip (addon files + helper exe) and, on a v* tag,
# publish it as a GitHub Release.
#
# - Pull request          -> check and build jobs only (zip artifact). No release,
#                            no tags, no publish.
# - Tag v* (e.g. v2.0.1)  -> checks, build, zip, GitHub Release with the zip.
# - Manual run            -> checks, build, zip as a workflow artifact only.
#
# This workflow never uploads anywhere else (in particular NOT to the RoR addon
# site); publishing there stays a manual step. The release job is tag-only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ADDON_NAME: UnrealFX
  PYTHON_VERSION: "3.12"
  PYINSTALLER_VERSION: "6.22.3"
  # ======================= RELEASE ZIP INCLUDE LIST =======================
  # The ONLY files that go into the release zip (paths/globs relative to the
  # repo root; the built helper exe is added separately). Edit here and only
  # here -- e.g. if asset licensing (issue #2) changes what can be shipped.
  # Never add .py, .cmd, .ps1, build scripts or other dev tooling.
  RELEASE_INCLUDE: |
    UnrealFX.mod
    UnrealFX.xml
    UnrealFX.lua
    files/*.tga
    files/*.wav
    files/squigicon.ico
    README.md
    CHANGELOG.md
  # ===================== END RELEASE ZIP INCLUDE LIST =====================

jobs:
  check:
    name: Checks (Lua, Python, version, ASCII)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Lua 5.1 syntax check
        run: |
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.1 -p
          echo "All .lua files pass luac5.1 -p"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python syntax check
        run: python -m py_compile UnrealFX.py

      - name: Read version (single source UnrealFX.mod) and match tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/.*<UiMod[^>]* version="\([^"]*\)".*/\1/p' UnrealFX.mod | head -n1)"
          if [ -z "$version" ]; then
            echo "::error file=UnrealFX.mod::Could not read version from UnrealFX.mod"
            exit 1
          fi
          echo "UnrealFX.mod version: $version"
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "$REF_NAME" != "v$version" ]; then
              echo "::error::Tag $REF_NAME does not match UnrealFX.mod version v$version"
              exit 1
            fi
          fi
          if ! grep -q "^## ${version}\b" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No '## ${version}' section in CHANGELOG.md"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Shipped text files are ASCII-only
        run: |
          bad=0
          for f in UnrealFX.mod UnrealFX.xml UnrealFX.lua README.md CHANGELOG.md; do
            if LC_ALL=C grep -nP '[^\x00-\x7F]' "$f"; then
              echo "::error file=$f::Non-ASCII characters found"
              bad=1
            fi
          done
          exit "$bad"

  build:
    name: Build exe and zip
    needs: check
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller==${{ env.PYINSTALLER_VERSION }}"

      - name: Build UnrealFX.exe (same flags as build_exe.cmd)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name UnrealFX `
            --icon "files\squigicon.ico" `
            --hidden-import tkinter `
            --hidden-import winsound `
            "UnrealFX.py"
          if (-not (Test-Path "dist\UnrealFX.exe")) { throw "dist\UnrealFX.exe was not produced" }

      - name: Assemble zip from include list
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stageRoot = Join-Path $env:RUNNER_TEMP 'stage'
          $stage = Join-Path $stageRoot $env:ADDON_NAME
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          $patterns = $env:RELEASE_INCLUDE -split "`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          foreach ($pattern in $patterns) {
            $matched = @(Get-ChildItem -Path $pattern -File)
            if ($matched.Count -eq 0) { throw "Include pattern matched nothing: $pattern" }
            foreach ($item in $matched) {
              $rel = Resolve-Path -Relative $item.FullName
              $rel = $rel -replace '^[.][\\/]', ''
              $dest = Join-Path $stage $rel
              New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
              Copy-Item $item.FullName $dest
            }
          }
          Copy-Item "dist\UnrealFX.exe" (Join-Path $stage 'UnrealFX.exe')

          # Guard: dev tooling must never ship.
          $forbidden = @(Get-ChildItem -Path $stage -Recurse -File |
            Where-Object { $_.Extension -in '.py', '.pyc', '.cmd', '.bat', '.ps1', '.spec', '.sh' })
          if ($forbidden.Count -gt 0) { throw "Dev tooling in release zip: $($forbidden.FullName -join ', ')" }

          New-Item -ItemType Directory -Force -Path out | Out-Null
          $zip = "out\$($env:ADDON_NAME)-$($env:VERSION).zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Write-Host "Zip contents:"
          Get-ChildItem -Path $stage -Recurse -File | ForEach-Object { Resolve-Path -Relative $_.FullName -RelativeBasePath $stageRoot }

      - name: Upload zip artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.ADDON_NAME }}-${{ env.VERSION }}
          path: out/${{ env.ADDON_NAME }}-${{ env.VERSION }}.zip
          if-no-files-found: error

  release:
    name: GitHub Release (tags only)
    needs: [check, build]
    # pull_request must never publish. workflow_dispatch on a non-tag ref
    # already fails this check because ref_type is branch.
    if: github.event_name != 'pull_request' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download zip artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ADDON_NAME }}-${{ env.VERSION }}
          path: out

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " v "([^0-9.]|$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo
            echo "Unzip into \`Interface/AddOns/\` so you get \`Interface/AddOns/${ADDON_NAME}/\`."
          } >> release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "out/${ADDON_NAME}-${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${ADDON_NAME} ${TAG}" \
            --notes-file release-notes.md \
            --verify-tag
